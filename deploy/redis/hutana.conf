# Redis (/etc/redis/redis.conf additions, or include this file): the local settings (docker/redis/redis.conf) on
# localhost only, with a password (REDIS_PASSWORD in the app's .env).
bind 127.0.0.1 -::1
protected-mode yes
port 6379
appendonly yes
appendfsync everysec
maxmemory 128mb
maxmemory-policy noeviction
requirepass CHANGE_ME
