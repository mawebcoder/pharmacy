; Production PHP (Ubuntu, /etc/php/8.5/{fpm,cli}/conf.d/99-hutana-production.ini), loaded after the shared
; docker/php/conf.d/app.ini (installed as 98-hutana.ini) so local and production use the same limits.
; A release never changes files in place (new folder + symlink switch), so OPcache never re-checks them.
[opcache]
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.jit = tracing
opcache.jit_buffer_size = 32M

[PHP]
display_errors = Off
log_errors = On
