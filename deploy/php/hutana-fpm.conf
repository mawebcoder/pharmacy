; PHP-FPM pool (/etc/php/8.5/fpm/pool.d/hutana.conf). Same process settings as the local pool
; (docker/php/php-fpm.d/zz-app.conf), on a socket for the local Nginx.
[hutana]
user = www-data
group = www-data
listen = /run/php/hutana.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

ping.path = /ping
ping.response = pong
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
