# Nginx catch-all (/etc/nginx/sites-available/00-catch-all.conf, linked into sites-enabled; installed on the server on
# 2026-11-27). Any host other than hutana.ir (scanners hitting the server IP, unknown names) gets its connection closed
# without an answer (444), so it never reaches Laravel. Without it, hutana.conf was the only HTTPS site and Nginx used it
# for every host: https://<server IP> served the shop and links were built on the IP.
# It carries the hutana.ir certificate, so a client that sends no SNI still completes the TLS handshake and is then
# routed by its Host header to hutana.conf. setup.sh installs it once that certificate exists.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/hutana.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hutana.ir/privkey.pem;

    access_log off;
    return 444;
}
