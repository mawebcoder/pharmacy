# Nginx site (/etc/nginx/sites-available/hutana.conf, linked into sites-enabled). The same rules as local
# (docker/nginx/conf.d/app.conf), serving the current release and passing PHP to the hutana PHP-FPM pool.
# Behind the ArvanCloud CDN. HTTPS on the server (set up by hand on 2026-11-27): certbot certonly --webroot -w
# /var/www/certbot -d hutana.ir -d www.hutana.ir, then in this same server block "listen 443 ssl; listen [::]:443 ssl;
# http2 on;" with ssl_certificate /etc/letsencrypt/live/hutana.ir/fullchain.pem and ssl_certificate_key .../privkey.pem.
# No redirect from port 80 here: the CDN redirects visitors, and Laravel does when APP_FORCE_HTTPS=true; a redirect in
# Nginx loops while the CDN reaches the server over HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name hutana.ir www.hutana.ir;

    root /var/www/hutana/current/public;
    index index.php;
    charset utf-8;

    client_max_body_size 25M;
    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Level 5 compresses far better than the default 1 for little CPU. Requests through the CDN carry a Via header,
    # which Nginx does not compress unless gzip_proxied allows it; Vary keeps the CDN from mixing up the two copies.
    gzip on;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Let's Encrypt's check files, for issuing and renewing the certificate (on 80 and 443).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; try_files $uri /index.php?$query_string; }
    location = /manifest.webmanifest { default_type application/manifest+json; access_log off; }

    # Generated image sizes (roadmap D14.4): the content hash is in the path, so they never change.
    location ^~ /storage/media/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:" always;
    }

    # Vite assets have a content hash in their name.
    location ^~ /build/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?)$ {
        try_files $uri /index.php?$query_string;
        expires 7d;
        access_log off;
    }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/hutana.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        # $realpath_root resolves the "current" symlink, so each request runs one release's files only.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
