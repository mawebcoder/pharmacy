; Supervisor (/etc/supervisor/conf.d/hutana.conf): Horizon and the scheduler, as in local Docker
; (docker/supervisor/conf.d), from the current release.
[program:hutana-horizon]
command=php /var/www/hutana/current/artisan horizon
user=www-data
autostart=true
autorestart=true
; Files Horizon and the scheduler write in storage stay writable by the deploy user (and the other way round).
umask=002
stopsignal=TERM
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/hutana/shared/storage/logs/horizon.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

[program:hutana-scheduler]
command=php /var/www/hutana/current/artisan schedule:work
user=www-data
autostart=true
autorestart=true
umask=002
stopsignal=TERM
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/var/www/hutana/shared/storage/logs/scheduler.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

; Commands run from «فرمان‌ها» in the admin (owner, 2026-11-28): only this worker takes the "commands" queue, and
; it runs as the deploy user (ADMIN_COMMANDS_USER=deploy makes any other user refuse). release.sh's queue:restart
; makes it pick up each new release after its current command.
[program:hutana-commands]
command=php /var/www/hutana/current/artisan queue:work redis --queue=commands --tries=1 --timeout=3600 --sleep=3
user=deploy
autostart=true
autorestart=true
umask=002
stopsignal=TERM
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/hutana/shared/storage/logs/commands.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

[group:hutana]
programs=hutana-horizon,hutana-scheduler,hutana-commands
