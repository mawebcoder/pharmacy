name: Deploy to production

# One button (Actions → "Deploy to production" → Run workflow) ships the newest dev commit whose CI passed; later
# commits still running or red stay out. No checks or build again: it takes the release archive dev's CI built from
# exactly that code (named after its git tree), uploads it over SSH and runs deploy/release.sh (zero-downtime switch,
# last 5 kept). Once the site answers, that commit is merged into main, so main always shows what is live; a push to main
# deploys nothing by itself. Rollback: rollback.yml. Server setup and the secrets this needs: deploy/README.md.

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The "production" environment holds the deploy secrets.
    environment:
      name: production
      url: ${{ vars.APP_URL }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # The newest dev commit whose CI passed: its release archive (named after its git tree) exists and that run's
      # checks and build both succeeded. Commits after it, still running or red, are left out.
      - name: Find the newest dev commit that passed CI
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin dev
          for sha in $(git rev-list --first-parent --max-count=30 origin/dev); do
            tree="$(git rev-parse "${sha}^{tree}")"
            run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=release-${tree}&per_page=1" \
              --jq '[.artifacts[] | select(.expired == false)][0].workflow_run.id // empty')"
            [ -n "${run_id}" ] || { echo "${sha::7}: no release built (CI not finished or failed)"; continue; }
            passed=yes
            for job in 'Checks (local Docker stack)' 'Production build and smoke test'; do
              conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" \
                --jq ".jobs[] | select(.name == \"${job}\") | .conclusion")"
              [ "${conclusion}" = "success" ] || { echo "${sha::7}: \"${job}\" is ${conclusion:-not finished}"; passed=no; }
            done
            if [ "${passed}" = yes ]; then
              echo "Deploying ${sha::7}, built and checked by dev run ${run_id}."
              { echo "sha=${sha}"; echo "tree=${tree}"; echo "run_id=${run_id}"; } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::None of dev's last 30 commits passed CI. Push a fix to dev, wait until it is green, then deploy."
          exit 1

      # main records what is live: merging that commit must give exactly its code, or the release would not be what
      # main says. Pushed only after the health check.
      - name: Merge the commit into main
        env:
          SHA: ${{ steps.release.outputs.sha }}
          TREE: ${{ steps.release.outputs.tree }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff --no-edit -m "Deploy dev ${SHA::7} to production" "${SHA}"
          if [ "$(git rev-parse 'HEAD^{tree}')" != "${TREE}" ]; then
            echo "::error::main has changes dev lacks. Merge main into dev, push, wait until dev is green, then deploy again."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: release-${{ steps.release.outputs.tree }}
          run-id: ${{ steps.release.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: SSH access
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host production
            HostName ${{ secrets.DEPLOY_HOST }}
            User ${{ secrets.DEPLOY_USER }}
            Port ${{ vars.DEPLOY_PORT || '22' }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            # Give up quickly when the server does not answer, instead of waiting for the job timeout.
            ConnectTimeout 20
            ServerAliveInterval 15
            ServerAliveCountMax 4
          EOF

      - name: Upload the release
        env:
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          scp release.tar.gz "production:/var/www/hutana/incoming/release-${SHA}.tar.gz"
          scp release.sh production:/var/www/hutana/release.sh
          ssh production chmod 755 /var/www/hutana/release.sh

      - name: Switch to the release
        env:
          SHA: ${{ steps.release.outputs.sha }}
        run: ssh production "/var/www/hutana/release.sh deploy ${SHA} /var/www/hutana/incoming/release-${SHA}.tar.gz"

      - name: Health check (rolls back on failure)
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if ! curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors "${APP_URL}/up" > /dev/null; then
            echo "Health check failed: rolling back." >&2
            ssh production /var/www/hutana/release.sh rollback
            exit 1
          fi

      # Pushed with the workflow's token, which starts no other workflow.
      - name: Record the release on main
        run: git push origin HEAD:main
