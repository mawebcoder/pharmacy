name: CI/CD

# Roadmap D19.5. Every job runs inside the local Docker stack (docker-compose.yml: PHP 8.5 with the server's
# extensions and php.ini, MySQL 8.4 with the server's my.cnf, Redis 7.4, Meilisearch 1.55, Nginx 1.28), so what
# passes here behaves the same on a developer's machine and on the production server, which runs the same
# versions natively (deploy/).
#
#   checks            every push except main (dev, feature branches): Pint, Larastan, composer audit and the asset
#                     build (the test suite runs locally, not in CI)
#   production-build  every push except main: the release exactly as the server gets it (no dev packages,
#                     optimized class map, built assets, APP_ENV=production), migrated and seeded on an empty
#                     database, cached, served by Nginx and smoke-tested; on dev it is kept as the release archive,
#                     named after the code's git tree
#
# Deploy: the "Deploy to production" button (deploy.yml) ships dev once it is green. Rollback: rollback.yml. Server setup and the secrets this needs: deploy/README.md.

on:
  push:
    # main only records what is live (deploy.yml merges dev into it): nothing to check there.
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push replaces a running check.
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (local Docker stack)
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env for the stack
        run: |
          cp .env.example .env
          # docker-compose.yml requires a Meilisearch key; files written in the container stay the runner's.
          sed -i 's/^MEILISEARCH_KEY=.*/MEILISEARCH_KEY=ci-meilisearch-master-key/' .env
          echo "DOCKER_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "DOCKER_GID=$(id -g)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build the local images (cached)
        uses: docker/bake-action@v6
        with:
          source: .
          files: docker-compose.yml
          targets: app,mysql,redis
          load: true
          set: |
            app.cache-from=type=gha,scope=app
            app.cache-to=type=gha,scope=app,mode=max
            mysql.cache-from=type=gha,scope=mysql
            mysql.cache-to=type=gha,scope=mysql,mode=max
            redis.cache-from=type=gha,scope=redis
            redis.cache-to=type=gha,scope=redis,mode=max

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-dev-${{ hashFiles('composer.lock') }}

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Cache Larastan results
        uses: actions/cache@v4
        with:
          path: storage/framework/cache/phpstan
          key: phpstan-${{ github.sha }}
          restore-keys: phpstan-

      - name: Start the stack
        run: docker compose up --detach --wait app

      - name: Install PHP packages
        run: docker compose exec -T app composer install --no-interaction --no-progress --prefer-dist

      - name: Application key
        run: docker compose exec -T app php artisan key:generate --no-interaction

      - name: Pint
        run: docker compose exec -T app vendor/bin/pint --test

      - name: Larastan
        run: docker compose exec -T app vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      # Exit 100 is Composer's network error (Packagist's advisory API unreachable, e.g. HTTP 502): tried three times,
      # then a warning, so an outage at Packagist does not block a release. Any advisory still fails the job.
      - name: Composer audit
        run: |
          for attempt in 1 2 3; do
            status=0
            docker compose exec -T app composer audit || status=$?
            [ "${status}" -ne 100 ] && exit "${status}"
            echo "Packagist's advisory API did not answer (attempt ${attempt})."
            sleep 15
          done
          echo "::warning::composer audit skipped: Packagist's advisory API is unreachable."

      - name: Build front-end assets
        run: docker compose exec -T app sh -c 'npm ci --no-audit --no-fund && npm run build'

      - name: Stack logs
        if: failure()
        run: docker compose logs --tail=200

  production-build:
    name: Production build and smoke test
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Prepare a production .env for the stack
        run: |
          cp .env.example .env
          sed -i \
            -e 's/^APP_ENV=.*/APP_ENV=production/' \
            -e 's/^APP_DEBUG=.*/APP_DEBUG=false/' \
            -e 's/^LOG_LEVEL=.*/LOG_LEVEL=warning/' \
            -e 's/^MEILISEARCH_KEY=.*/MEILISEARCH_KEY=ci-meilisearch-master-key/' \
            .env
          # The super admin seeder refuses the default password in production (as on the server).
          echo "SUPERADMIN_PASSWORD=ci-only-$(openssl rand -hex 12)" >> .env
          echo "DOCKER_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "DOCKER_GID=$(id -g)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build the local images (cached)
        uses: docker/bake-action@v6
        with:
          source: .
          files: docker-compose.yml
          targets: app,nginx,mysql,redis
          load: true
          set: |
            app.cache-from=type=gha,scope=app
            nginx.cache-from=type=gha,scope=nginx
            nginx.cache-to=type=gha,scope=nginx,mode=max
            mysql.cache-from=type=gha,scope=mysql
            redis.cache-from=type=gha,scope=redis

      - name: Cache production Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-prod-${{ hashFiles('composer.lock') }}

      - name: Start the stack
        run: docker compose up --detach --wait app

      - name: Install production packages and build assets
        run: |
          docker compose exec -T app composer install --no-dev --classmap-authoritative --no-interaction --no-progress --prefer-dist
          docker compose exec -T app sh -c 'npm ci --no-audit --no-fund && npm run build'

      # The same release commands as deploy/release.sh, on an empty database, without dev packages.
      - name: Release commands
        run: |
          docker compose exec -T app php artisan key:generate --force --no-interaction
          docker compose exec -T app php artisan migrate --force --no-interaction
          docker compose exec -T app php artisan db:seed --force --no-interaction
          docker compose exec -T app php artisan scout:sync-index-settings --no-interaction
          docker compose exec -T app php artisan optimize --no-interaction
          docker compose exec -T app php artisan filament:optimize --no-interaction

      - name: Serve through Nginx and smoke test
        run: |
          docker compose up --detach --wait nginx
          for path in /up / /products /login /admin/login; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' "http://localhost:7000${path}")
            echo "${path} -> ${status}"
            [ "${status}" = "200" ] || exit 1
          done

      - name: Package the release
        id: package
        if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
        run: |
          # Named after the git tree (the code itself), so main's merge commit finds the archive built from it.
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          docker compose exec -T app php artisan optimize:clear --no-interaction
          docker compose exec -T app php artisan filament:optimize-clear --no-interaction
          # Nothing may write in the folder while it is packed: the stack is stopped, and the archive is written
          # outside it (tar fails with "file changed as we read it" otherwise).
          docker compose stop
          tar --create --gzip --file "${RUNNER_TEMP}/release.tar.gz" \
            --exclude=./.git --exclude=./.github --exclude=./.claude --exclude=./.env --exclude='./.env.*' \
            --exclude=./node_modules --exclude=./tests --exclude='./app/Modules/*/Tests' \
            --exclude=./docker --exclude=./docker-compose.yml --exclude=./deploy --exclude=./docs \
            --exclude=./storage --exclude=./public/storage --exclude=./public/hot \
            --exclude='./bootstrap/cache/*.php' --exclude=./graphify-out --exclude=./app/graphify-out \
            --exclude='./HANDOFF*.md' \
            .
          cp deploy/release.sh "${RUNNER_TEMP}/release.sh"

      - name: Keep the release archive
        if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.package.outputs.tree }}
          path: |
            ${{ runner.temp }}/release.tar.gz
            ${{ runner.temp }}/release.sh
          retention-days: 14
          if-no-files-found: error

      - name: Stack logs
        if: failure()
        run: |
          docker compose logs --tail=200
          docker compose exec -T app sh -c 'tail -n 100 storage/logs/*.log' || true
