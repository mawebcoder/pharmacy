; Commands run from «فرمان‌ها» in the admin (the "commands" queue; Horizon does not take it). On the server this
; worker runs as the deploy user (deploy/supervisor/hutana.conf).
[program:commands]
command=php /var/www/html/artisan queue:work redis --queue=commands --tries=1 --timeout=3600 --sleep=3
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
