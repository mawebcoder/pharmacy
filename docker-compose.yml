name: pharmacy

x-php: &php
  build: &php-build
    context: ./docker
    dockerfile: php/Dockerfile
    args:
      UID: ${DOCKER_UID:-1000}
      GID: ${DOCKER_GID:-1000}
  restart: unless-stopped
  environment:
    TZ: ${APP_TIMEZONE:-UTC}
  volumes:
    - ./:/var/www/html
  networks:
    - pharmacy
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
    meilisearch:
      condition: service_healthy

services:
  app:
    <<: *php
    build:
      <<: *php-build
      target: app
    image: pharmacy/app:dev
    ports:
      - "${VITE_PORT:-5173}:5173"

  supervisor:
    <<: *php
    build:
      <<: *php-build
      target: supervisor
    image: pharmacy/supervisor:dev
    depends_on:
      app:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    build:
      context: ./docker/nginx
    image: pharmacy/nginx:dev
    restart: unless-stopped
    ports:
      - "${APP_PORT:-7000}:80"
    volumes:
      - ./:/var/www/html:ro
    networks:
      - pharmacy
    depends_on:
      app:
        condition: service_healthy

  mysql:
    build:
      context: ./docker/mysql
    image: pharmacy/mysql:dev
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-7070}:3306"
    environment:
      TZ: ${APP_TIMEZONE:-UTC}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - pharmacy

  redis:
    build:
      context: ./docker/redis
    image: pharmacy/redis:dev
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - pharmacy

  # Product search (roadmap D21, decided 2026-11-07 in S12): reachable only inside the Docker network.
  meilisearch:
    image: getmeili/meilisearch:v1.55.1
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:?Set MEILISEARCH_KEY in .env}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch-data:/meili_data
    networks:
      - pharmacy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

networks:
  pharmacy:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  meilisearch-data:
